name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      # The full-disk tests mount a small tmpfs in a user namespace
      # (internal/testfs); Ubuntu 24.04 restricts those by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make test-race
      - name: build linux/arm64
        run: GOOS=linux GOARCH=arm64 make build-go

  # Allocation counts per operation, against the pull request's base: they
  # are the same on every machine, so a shared runner can compare them.
  allocs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: scripts/bench-allocs.sh origin/${{ github.base_ref }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make web-lint
      - run: make web-test
      # Builds the dashboard, then a linux/arm64 binary that embeds it.
      - run: GOOS=linux GOARCH=arm64 make build
      - run: go vet -tags embedui ./...

# Builds the documentation site (site/, from docs/) on every change to it,
# and publishes it to GitHub Pages from main: https://ofk0.github.io/piway/
name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, site/**, install.sh, web/public/favicon.svg, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, site/**, install.sh, web/public/favicon.svg, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one
# that is half published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: site
      # Fails on a broken link between pages.
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: e2e

# The real piway binary on real arm64 hardware with real Docker: every
# example app deployed from a local git repository by a signed webhook,
# zero failed requests during a redeploy, rollback, secrets, volumes,
# kill -9, databases, and the dashboard in a browser (e2e/README.md).
#
# It takes 20 to 40 minutes, so nothing waits for it: no pull request, no
# release, no schedule. Start it by hand from the Actions tab (Run workflow),
# or run `make e2e` on a machine with Docker.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # Native arm64, like the Pi: the images are built for linux/arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/dashboard/package-lock.json

      - name: Browser for the dashboard checks
        run: make e2e-deps

      - name: Docker
        run: |
          docker version --format '{{.Server.Version}} {{.Server.Arch}}'
          df -h / | tail -1

      # make e2e builds the binary (with the dashboard embedded) first.
      - name: End to end
        env:
          E2E_PRIVATE_REPO: ${{ secrets.E2E_PRIVATE_REPO }}
          E2E_DEPLOY_KEY: ${{ secrets.E2E_DEPLOY_KEY }}
        run: make e2e

      - name: Disk left
        if: always()
        run: df -h / | tail -1

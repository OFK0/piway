name: release

# Pushing a tag like v0.4.0 publishes a GitHub release with the Raspberry Pi
# binary. See docs/RELEASING.md.
#
# Pull requests that touch the release path run the same build and checks
# as a dry run (version v0.0.0-dryrun), without attesting or publishing,
# so the pipeline is tested before a real tag needs it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile

# One release run per tag; a re-pushed tag waits for the previous run.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Native arm64: the binary that ships is the binary that is tested.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0-dryrun' }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the main-branch check and commit timestamps

      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH[-pre])"
            exit 1
          fi
          [ "$PUBLISH" = true ] || exit 0 # a dry run builds the PR itself
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test
        run: |
          make lint
          make test-race
          make web-lint
          make web-test

      - name: Build
        run: make dist VERSION="$TAG"

      - name: Verify the archive
        run: |
          cd dist
          sha256sum -c checksums.txt
          tar -xzf piway_linux_arm64.tar.gz
          # Licenses travel with the binary (MIT for piway, notices for the rest).
          grep -q "MIT License" piway_linux_arm64/LICENSE
          grep -q "SIL Open Font License" piway_linux_arm64/THIRD_PARTY_NOTICES.txt

          got=$(./piway_linux_arm64/piway -version)
          # PR runs check out a merge commit; the build stamps that commit.
          want="piway $TAG ($(git rev-parse --short HEAD))"
          if [ "$got" != "$want" ]; then
            echo "::error::-version says '$got', want '$want'"
            exit 1
          fi

          # Smoke test: the API reports the tag and the dashboard is embedded.
          ./piway_linux_arm64/piway -addr 127.0.0.1:18080 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:18080/healthz >/dev/null && break; sleep 0.1; done
          curl -fs http://127.0.0.1:18080/healthz | grep -F "\"version\":\"$TAG\""
          curl -fs http://127.0.0.1:18080/ | grep -qi "<!doctype html>"
          curl -fs http://127.0.0.1:18080/THIRD_PARTY_NOTICES.txt | cmp - piway_linux_arm64/THIRD_PARTY_NOTICES.txt

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/piway_linux_arm64.tar.gz

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --title "$TAG" --generate-notes)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/piway_linux_arm64.tar.gz dist/checksums.txt "${flags[@]}"

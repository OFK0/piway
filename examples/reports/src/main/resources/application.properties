server.port=${PORT:8080}
# On SIGTERM: stop taking requests, let those in flight finish (up to 20 s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.forward-headers-strategy=framework
spring.main.banner-mode=off
logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p","logger":"%logger{0}","msg":"%m"}%n
# A small pool: a Pi has four cores and other apps.
spring.datasource.hikari.maximum-pool-size=4

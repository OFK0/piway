# piway configuration. Copy to ~/.config/piway/config.yaml and uncomment what
# you want to change; every value shown is the default. See docs/CONFIG.md.

# HTTP listen address. Use "127.0.0.1:8080" to accept local connections only.
# addr: ":8080"

# How often metrics are collected. Minimum 100ms.
# interval: 1s

# How many snapshots a WebSocket client may fall behind before it is
# disconnected (8 snapshots = 8 seconds at the default interval).
# stream_queue: 8

# debug, info, warn or error.
# log_level: info

# Where the metrics history is stored. "" disables recording.
# data_dir: "~/.local/state/piway"

# How long samples may wait in memory before they are written to the SD
# card. Longer = fewer writes; a crash loses up to this much history.
# flush_interval: 1m

# How long the history is kept at each resolution (docs/STORAGE.md).
# retention_raw: 24h
# retention_1m: 7d
# retention_1h: 365d

# Publish each app at <name>.<proxy_domain> through Caddy (docs/PROXY.md).
# "" disables it.
# proxy_domain: ""
# proxy_listen: ":8443"
# proxy_tls: true
# caddy_admin: "localhost:2019"
